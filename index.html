<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="My Habits" />
<title>My Habits</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231987C7'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23ffffff' stroke-width='10'/%3E%3Ccircle cx='72' cy='76' r='7' fill='%23ffffff'/%3E%3Ccircle cx='108' cy='76' r='7' fill='%23ffffff'/%3E%3Cpath d='M66 102 Q90 126 114 102' fill='none' stroke='%23ffffff' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --header-blue: #1987c7;
    --peach: #fbe5d6;
    --mint: #c5e0b4;
    --pink: #f4cccc;
    --sky: #75b8e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .lang-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }
  main {
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }
  .nav-row button {
    border: none;
    background: #f3f4f6;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-row button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .nav-title {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }

  /* DAILY VIEW */
  .habit-btn {
    width: 100%;
    border: 1.5px solid #1f2937;
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: 600;
    color: #111827;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .habit-btn:active { transform: scale(0.985); }
  .habit-btn.done .habit-label {
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    opacity: 0.72;
  }
  .habit-btn.disabled-day {
    opacity: 0.45;
    border-style: dashed;
    cursor: not-allowed;
  }
  .badge {
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.7);
    padding: 3px 8px;
    border-radius: 999px;
  }

  /* WEEKLY VIEW */
  .week-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(96px, 1fr));
    gap: 4px;
  }
  .week-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .week-date-hdr {
    background: var(--header-blue);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    padding: 6px 2px;
    border-radius: 4px;
  }
  .week-cell {
    border: 1px solid #1f2937;
    border-radius: 8px;
    min-height: 44px;
    padding: 4px 6px;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
  }
  .week-cell.done {
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    opacity: 0.75;
  }
  .week-cell.off-day {
    opacity: 0.3;
  }

  /* MONTHLY VIEW */
  .month-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 8px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid #374151;
    flex-shrink: 0;
  }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekday-lbl {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .day-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .day-box-hdr {
    background: var(--header-blue);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    padding: 2px 0;
  }
  .day-box.out-range { opacity: 0.35; }
  .mini-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    padding: 2px;
  }
  .mini-bar {
    height: 18px;
    border: 1px solid #1f2937;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mini-bar.off-day { opacity: 0.25; }
  .smile-svg { width: 13px; height: 13px; }

  /* STATS VIEW */
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .stat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .stat-dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 14px;
    column-gap: 12px;
  }
  .stat-lbl {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .stat-val {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }
  .backup-box {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .backup-box button {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }

  /* BOTTOM TAB BAR */
  nav.tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 30;
  }
  .tab-btn {
    border: none;
    background: none;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--header-blue); }
  .tab-icon { font-size: 18px; line-height: 1; }
</style>
</head>
<body>

<header>
  <h1 id="app-title">Daily View</h1>
  <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">中文</button>
</header>

<main id="app-content"></main>

<nav class="tab-bar">
  <button class="tab-btn active" data-tab="daily" onclick="switchTab('daily')">
    <span class="tab-icon">✓</span>
    <span id="tab-lbl-daily">Daily</span>
  </button>
  <button class="tab-btn" data-tab="weekly" onclick="switchTab('weekly')">
    <span class="tab-icon">▦</span>
    <span id="tab-lbl-weekly">Weekly</span>
  </button>
  <button class="tab-btn" data-tab="monthly" onclick="switchTab('monthly')">
    <span class="tab-icon">📅</span>
    <span id="tab-lbl-monthly">Monthly</span>
  </button>
  <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">
    <span class="tab-icon">📊</span>
    <span id="tab-lbl-stats">Stats</span>
  </button>
</nav>
