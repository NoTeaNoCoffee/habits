<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Habits</title>
<style>
  :root {
    --border: #e4e4e7; --muted: #71717a; --text: #18181b; --accent: #4caf50; --bg: #fafafa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
  header h1 { font-size: 22px; margin: 0; }
  .lang { border: 1px solid var(--border); background: #fff; border-radius: 16px; padding: 4px 12px; font-size: 14px; }
  main { padding: 8px 16px 24px; max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Period navigator */
  .nav { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
  .nav .arrow { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 20px; }
  .nav .arrow:disabled { opacity: .3; }
  .nav .label { flex: 1; position: relative; height: 40px; border: 2px solid var(--accent); border-radius: 10px;
    background: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; }
  .nav .label input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .sub { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .link { background: none; border: none; color: #2563eb; padding: 0; font-size: 14px; }

  /* Daily */
  .habit { display: flex; align-items: center; justify-content: center; position: relative; width: 100%;
    min-height: 56px; margin-bottom: 12px; border: none; border-radius: 12px; font-size: 18px; padding: 8px 44px; }
  .habit.done .name { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .75; }
  .habit .check { position: absolute; right: 12px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .habit .check .smile { width: 100%; height: 100%; max-width: none; max-height: none; }
  .habit:active { transform: scale(.98); }
  .rest { color: var(--muted); font-size: 14px; text-align: center; margin: 4px 0 12px; }
  .note-box { margin-top: 8px; }
  .note-box label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .note-box textarea { width: 100%; min-height: 96px; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-size: 16px; background: #fff; resize: vertical; }
  .note-box .saved { font-size: 12px; color: var(--muted); height: 16px; margin-top: 4px; }
  .banner { text-align: center; font-size: 17px; margin: 8px 0; }

  /* Shared table look (matches the draft) */
  .hd { background: #4A9FD4; color: #000; border: none; text-align: center; font-weight: 600; line-height: 1.2; }
  .hd.today { background: #2E7BB0; color: #fff; }
  .smile { width: 70%; height: 70%; max-width: 26px; max-height: 26px; }
  .smile * { stroke: #000; }
  .full { display: none; } .short { display: inline; }
  @media (min-width: 700px) { .full { display: inline; } .short { display: none; } main { max-width: 900px; } }

  /* Weekly: 7 columns x 4 habit rows */
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px 2px; }
  .wk .hd { font-size: 12px; padding: 5px 0; }
  .wk .c { border: 1.5px solid #000; border-radius: 6px; min-height: 52px; padding: 1px 0; display: flex; align-items: center;
    justify-content: center; text-align: center; font-size: 10px; line-height: 1.25; word-break: normal; overflow-wrap: anywhere; }
  .wk .c.done { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .wk .c.off { background: #f4f4f5; border: 1.5px dashed #d4d4d8; color: #a1a1aa; }

  /* Monthly: calendar, each day = header + 2x2 tiles */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 3px; }
  .grid .wd { text-align: center; font-size: 12px; color: var(--muted); }
  .cell { padding: 0; border: none; background: none; display: flex; flex-direction: column; gap: 1px; }
  .cell .hd { font-size: 11px; padding: 2px 0; }
  .cell.locked { opacity: .35; }
  .quad { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  .q { border: 1.2px solid #000; border-radius: 4px; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center; }
  .q.off { background: #f4f4f5; border: 1.2px dashed #d4d4d8; }
  .legend { margin-top: 16px; display: grid; gap: 6px; font-size: 14px; }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .sw { width: 34px; height: 24px; border: 1.2px solid #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

  /* Stats */
  .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .card h3 .sw { width: 14px; height: 14px; border-radius: 4px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; }
  .kv b { font-size: 18px; display: block; }
  .kv span { color: var(--muted); }
  .tools { display: flex; gap: 8px; margin-top: 16px; }
  .tools button, .tools label { flex: 1; text-align: center; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 10px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* Tab bar */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fff; border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { flex: 1; border: none; background: none; padding: 10px 0 12px; font-size: 13px; color: var(--muted); }
  .tabs button .ico { display: block; font-size: 20px; }
  .tabs button.on { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="title">Habits</h1>
  <button class="lang" id="lang">中文</button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>

<script>
// ---------- Config ----------
const START = '2026-10-01';               // earliest editable day
const EVERY_DAY = [0, 1, 2, 3, 4, 5, 6];  // Sun=0 ... Sat=6
const WEEKDAYS = [1, 2, 3, 4, 5];
const HABITS = [
  { id: 'test',     color: '#FBE6DE', days: EVERY_DAY, en: 'Daily English Test',      zh: '每日英语测试', sEn: 'Eng. Test', sZh: '英语测试' },
  { id: 'listen',   color: '#CCF1D4', days: WEEKDAYS,  en: 'Daily English Listening', zh: '每日英语听力', sEn: 'Listen',    sZh: '英语听力' },
  { id: 'exercise', color: '#F3D7F0', days: EVERY_DAY, en: 'Exercise 500 kJ',         zh: '运动500KJ',   sEn: 'Exercise 500kJ', sZh: '运动500KJ' },
  { id: 'strength', color: '#6FD3F7', days: EVERY_DAY, en: 'Resistance Training',     zh: '抗阻训练',     sEn: 'Strength',   sZh: '抗阻训练' },
];

const T = {
  en: {
    daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly', stats: 'Stats', title: 'Habits',
    today: 'Today', hint: 'Tap a habit when done · tap again to undo',
    allDone: 'All done! 😊', note: 'Note', notePh: 'Why something was missed, or anything else…', saved: 'Saved', rest: 'English Listening: weekend off',
    tapDay: 'Tap a day to open it in Daily view',
    legendDone: 'Completed', offDay: 'Not scheduled (weekend listening off)', cur: 'Current streak', best: 'Best streak',
    month: 'This month', total: 'Since 2026/10/01', days: 'd',
    perfect: 'Perfect days (all habits)', backup: 'Backup',
    exp: 'Export', imp: 'Import', imported: 'Backup imported.', badFile: 'Could not read that file.',
    backupNote: 'Data is stored only on this phone. Export a backup now and then.',
    wd: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    monthName: (y, m) => new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
    switchTo: '中文',
  },
  zh: {
    daily: '日', weekly: '周', monthly: '月', stats: '统计', title: '习惯',
    today: '今天', hint: '完成后点击 · 再点一次取消',
    allDone: '全部完成！😊', note: '备注', notePh: '未完成的原因，或其他想记录的…', saved: '已保存', rest: '英语听力：周末休息',
    tapDay: '点击某一天可在日视图中编辑',
    legendDone: '已完成', offDay: '无需完成（周末无听力）', cur: '当前连续', best: '最长连续',
    month: '本月', total: '自 2026/10/01', days: '天',
    perfect: '完美天数（全部完成）', backup: '备份',
    exp: '导出', imp: '导入', imported: '备份已导入。', badFile: '无法读取该文件。',
    backupNote: '数据只保存在这部手机上，请不时导出备份。',
    wd: ['一', '二', '三', '四', '五', '六', '日'],
    monthName: (y, m) => `${y}年${m + 1}月`,
    switchTo: 'English',
  },
};

// ---------- Date helpers (local time, never UTC) ----------
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const todayDate = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmt = d => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const wdIndex = d => (d.getDay() + 6) % 7; // Mon=0
const START_DATE = parse(START);
const inRange = d => d >= START_DATE && d <= todayDate();
const scheduled = (h, d) => h.days.includes(d.getDay());

// ---------- Storage ----------
const STORE = 'habits.v1';
let done = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } })();
let lang = localStorage.getItem('habits.lang') || 'en';
const NOTES = 'habits.notes.v1';
let notes = (() => { try { return JSON.parse(localStorage.getItem(NOTES)) || {}; } catch { return {}; } })();
function setNote(k, text) {
  if (text.trim()) notes[k] = text; else delete notes[k];
  localStorage.setItem(NOTES, JSON.stringify(notes));
}
const noteMark = k => notes[k] ? ' 📝' : '';
const save = () => localStorage.setItem(STORE, JSON.stringify(done));
const isDone = (id, k) => (done[k] || []).includes(id);
function toggle(id, k) {
  const s = new Set(done[k] || []);
  s.has(id) ? s.delete(id) : s.add(id);
  if (s.size) done[k] = [...s]; else delete done[k];
  save();
}

// ---------- UI state ----------
let view = 'daily';
let cursor = todayDate();                 // day shown in Daily view
let week = mondayOf(todayDate());         // Monday shown in Weekly view
let month = { y: todayDate().getFullYear(), m: todayDate().getMonth() };
let lastToday = keyOf(todayDate());

const t = k => T[lang][k];
const name = h => h[lang];
const $view = document.getElementById('view');
const SMILE = '<svg class="smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.3" fill="#000" stroke="none"/><circle cx="15.5" cy="10" r="1.3" fill="#000" stroke="none"/><path d="M7.5 14.5 q4.5 4 9 0" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>';
const both = (full, short) => `<span class="full">${full}</span><span class="short">${short}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function navBar(label, prevOk, nextOk, extra = '') {
  return `<div class="nav">
    <button class="arrow" data-act="prev" ${prevOk ? '' : 'disabled'}>‹</button>
    <div class="label">${label}${extra}</div>
    <button class="arrow" data-act="next" ${nextOk ? '' : 'disabled'}>›</button>
  </div>`;
}

// ---------- Views ----------
function renderDaily() {
  const k = keyOf(cursor);
  const list = HABITS.filter(h => scheduled(h, cursor));
  const n = list.filter(h => isDone(h.id, k)).length;
  const picker = `<input type="date" id="pick" min="${START}" max="${keyOf(todayDate())}" value="${k}">`;
  let html = navBar(`${fmt(cursor)} · ${t('wd')[wdIndex(cursor)]}`, cursor > START_DATE, cursor < todayDate(), picker);
  html += `<div class="sub"><span>${t('hint')}</span>${keyOf(cursor) !== keyOf(todayDate()) ? `<button class="link" data-act="today">${t('today')}</button>` : `<span>${n}/${list.length}</span>`}</div>`;
  for (const h of list) {
    const d = isDone(h.id, k);
    html += `<button class="habit ${d ? 'done' : ''}" style="background:${h.color}" data-habit="${h.id}">
      <span class="name">${esc(name(h))}</span><span class="check">${d ? SMILE : ''}</span></button>`;
  }
  if (list.length < HABITS.length) html += `<div class="rest">${t('rest')}</div>`;
  if (n === list.length) html += `<div class="banner">${t('allDone')}</div>`;
  html += `<div class="note-box"><label for="note">${t('note')}</label>
    <textarea id="note" maxlength="1000" placeholder="${esc(t('notePh'))}">${esc(notes[k] || '')}</textarea>
    <div class="saved" id="saved"></div></div>`;
  $view.innerHTML = html;
  let timer;
  document.getElementById('note').addEventListener('input', e => {
    setNote(k, e.target.value);
    const el = document.getElementById('saved'); el.textContent = t('saved');
    clearTimeout(timer); timer = setTimeout(() => { el.textContent = ''; }, 1200);
  });
  document.getElementById('pick').addEventListener('change', e => {
    if (!e.target.value) return;
    const d = parse(e.target.value);
    if (inRange(d)) { cursor = d; render(); }
  });
}

function renderWeekly() {
  const end = addDays(week, 6), tk = keyOf(todayDate());
  let html = navBar(`${fmt(week)} – ${pad(end.getMonth() + 1)}/${pad(end.getDate())}`, week > START_DATE, end < todayDate());
  html += `<div class="sub"><span>${t('tapDay')}</span></div><div class="wk">`;
  const days = [...Array(7)].map((_, i) => addDays(week, i));
  html += days.map((d, i) => `<button class="hd${keyOf(d) === tk ? ' today' : ''}" data-day="${keyOf(d)}">${
    both(`${fmt(d)}<br>${t('wd')[i]}${noteMark(keyOf(d))}`, `${pad(d.getMonth() + 1)}/${pad(d.getDate())}<br>${t('wd')[i]}${noteMark(keyOf(d))}`)}</button>`).join('');
  for (const h of HABITS) for (const d of days) {
    const k = keyOf(d);
    html += scheduled(h, d)
      ? `<button class="c ${isDone(h.id, k) ? 'done' : ''}" style="background:${h.color}" data-day="${k}">${both(esc(name(h)), esc(h[lang === 'zh' ? 'sZh' : 'sEn']))}</button>`
      : `<div class="c off">–</div>`;
  }
  $view.innerHTML = html + '</div>';
}

function renderMonthly() {
  const { y, m } = month;
  const first = new Date(y, m, 1), daysIn = new Date(y, m + 1, 0).getDate();
  const t0 = todayDate();
  let html = navBar(T[lang].monthName(y, m), first > START_DATE, new Date(y, m + 1, 1) <= t0);
  html += `<div class="sub"><span>${t('tapDay')}</span></div><div class="grid">`;
  html += t('wd').map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < wdIndex(first); i++) html += `<div></div>`;
  for (let day = 1; day <= daysIn; day++) {
    const d = new Date(y, m, day), k = keyOf(d), ok = inRange(d);
    const tiles = HABITS.map(h => scheduled(h, d)
      ? `<div class="q" style="background:${h.color}">${ok && isDone(h.id, k) ? SMILE : ''}</div>`
      : `<div class="q off"></div>`).join('');
    html += `<button class="cell${ok ? '' : ' locked'}" data-day="${k}">
      <div class="hd${k === keyOf(t0) ? ' today' : ''}">${day}${noteMark(k)}</div><div class="quad">${tiles}</div></button>`;
  }
  html += `</div><div class="legend">`;
  html += HABITS.map(h => `<div class="row"><span class="sw" style="background:${h.color}"></span>${esc(name(h))}</div>`).join('');
  html += `<div class="row"><span class="sw" style="background:#fff">${SMILE}</span>${t('legendDone')}</div>`;
  html += `<div class="row"><span class="sw" style="background:#f4f4f5;border-style:dashed;border-color:#d4d4d8"></span>${t('offDay')}</div></div>`;
  $view.innerHTML = html;
}

// Streaks count scheduled days only; today not yet done does not break a streak.
function streaks(isHit, isSched) {
  let best = 0, run = 0;
  const t0 = todayDate();
  for (let d = START_DATE; d <= t0; d = addDays(d, 1)) {
    if (!isSched(d)) continue;
    if (isHit(d)) { run++; best = Math.max(best, run); } else if (keyOf(d) !== keyOf(t0)) run = 0;
  }
  return { cur: run, best };
}
function rate(isHit, isSched, from) {
  let hit = 0, all = 0;
  for (let d = from; d <= todayDate(); d = addDays(d, 1)) if (isSched(d)) { all++; if (isHit(d)) hit++; }
  return `${hit}/${all}${all ? ` · ${Math.round(100 * hit / all)}%` : ''}`;
}

function renderStats() {
  const t0 = todayDate();
  const mStart = new Date(Math.max(new Date(t0.getFullYear(), t0.getMonth(), 1), START_DATE));
  let html = '';
  for (const h of HABITS) {
    const hit = d => isDone(h.id, keyOf(d)), sch = d => scheduled(h, d);
    const s = streaks(hit, sch);
    html += `<div class="card"><h3><span class="sw" style="background:${h.color}"></span>${esc(name(h))}</h3>
      <div class="kv">
        <div><span>${t('cur')}</span><b>${s.cur} ${t('days')}</b></div>
        <div><span>${t('best')}</span><b>${s.best} ${t('days')}</b></div>
        <div><span>${t('month')}</span><b>${rate(hit, sch, mStart)}</b></div>
        <div><span>${t('total')}</span><b>${rate(hit, sch, START_DATE)}</b></div>
      </div></div>`;
  }
  const allHit = d => HABITS.every(h => !scheduled(h, d) || isDone(h.id, keyOf(d)));
  const p = streaks(allHit, () => true);
  html += `<div class="card"><h3>⭐ ${t('perfect')}</h3><div class="kv">
      <div><span>${t('cur')}</span><b>${p.cur} ${t('days')}</b></div>
      <div><span>${t('best')}</span><b>${p.best} ${t('days')}</b></div>
      <div><span>${t('month')}</span><b>${rate(allHit, () => true, mStart)}</b></div>
      <div><span>${t('total')}</span><b>${rate(allHit, () => true, START_DATE)}</b></div>
    </div></div>`;
  html += `<div class="tools"><button data-act="export">${t('exp')}</button>
    <label>${t('imp')}<input type="file" accept="application/json,.json" id="importFile" hidden></label></div>
    <div class="note">${t('backupNote')}</div>`;
  $view.innerHTML = html;
  document.getElementById('importFile').addEventListener('change', importBackup);
}

// ---------- Backup ----------
async function exportBackup() {
  const json = JSON.stringify({ app: 'habits', version: 2, exported: new Date().toISOString(), done, notes }, null, 1);
  const file = new File([json], `habits-backup-${keyOf(todayDate())}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch { /* user cancelled */ }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const src = obj && obj.done;
    if (!src || typeof src !== 'object') throw 0;
    const ids = new Set(HABITS.map(h => h.id));
    for (const [k, v] of Object.entries(src)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(v)) continue;
      const merged = new Set([...(done[k] || []), ...v.filter(id => ids.has(id))]);
      if (merged.size) done[k] = [...merged];
    }
    if (obj.notes && typeof obj.notes === 'object') {
      for (const [k, v] of Object.entries(obj.notes)) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v === 'string' && v.trim() && !notes[k]) notes[k] = v.slice(0, 1000);
      }
      localStorage.setItem(NOTES, JSON.stringify(notes));
    }
    save(); alert(t('imported')); render();
  } catch { alert(t('badFile')); }
}

// ---------- Shell ----------
const TABS = [['daily', '☑️'], ['weekly', '🗓️'], ['monthly', '📅'], ['stats', '📈']];
function render() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('title').textContent = t('title');
  document.getElementById('lang').textContent = t('switchTo');
  document.getElementById('tabs').innerHTML = TABS.map(([v, ico]) =>
    `<button class="${v === view ? 'on' : ''}" data-tab="${v}"><span class="ico">${ico}</span>${t(v)}</button>`).join('');
  ({ daily: renderDaily, weekly: renderWeekly, monthly: renderMonthly, stats: renderStats })[view]();
}

function step(dir) {
  if (view === 'daily') { const d = addDays(cursor, dir); if (inRange(d)) cursor = d; }
  if (view === 'weekly') week = addDays(week, 7 * dir);
  if (view === 'monthly') { const d = new Date(month.y, month.m + dir, 1); month = { y: d.getFullYear(), m: d.getMonth() }; }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-habit],[data-day],[data-act],#lang');
  if (!el) return;
  if (el.id === 'lang') { lang = lang === 'en' ? 'zh' : 'en'; localStorage.setItem('habits.lang', lang); return render(); }
  if (el.dataset.tab) { view = el.dataset.tab; return render(); }
  if (el.dataset.habit) { toggle(el.dataset.habit, keyOf(cursor)); return render(); }
  if (el.dataset.day) { const d = parse(el.dataset.day); if (inRange(d)) { cursor = d; view = 'daily'; render(); } return; }
  const act = el.dataset.act;
  if (act === 'prev') step(-1);
  if (act === 'next') step(1);
  if (act === 'today') { cursor = todayDate(); render(); }
  if (act === 'export') exportBackup();
});

// When the app is reopened on a new day, jump to the new "today".
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const k = keyOf(todayDate());
  if (k !== lastToday) { lastToday = k; cursor = todayDate(); week = mondayOf(cursor); month = { y: cursor.getFullYear(), m: cursor.getMonth() }; render(); }
});

// Deep links for Shortcuts/widgets: ?view=weekly etc.
const qv = new URLSearchParams(location.search).get('view');
if (TABS.some(([v]) => v === qv)) view = qv;

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
